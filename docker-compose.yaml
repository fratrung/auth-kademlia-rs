# peer1 publishes version 0 of a new DID and writes the DID to /shared/did;
# peer2 waits for that file and retrieves the record (ADR 0005). The DID is
# the hash of the first document, so it changes on every run: like a real
# verifier, the retriever learns it from outside, here the shared volume.

services:
  seed:
    build: .
    container_name: dht_seed
    environment:
      - NODE_PORT=5678
      - IS_SEED=true
      - RUST_LOG=info
    networks:
      dht_net:
        ipv4_address: 172.20.0.10
    ports:
      - "5678:5678/udp"

  peer1:
    build: .
    container_name: dht_peer_1
    environment:
      - NODE_PORT=5679
      - BOOTSTRAP_ADDR=172.20.0.10:5678
      - ROLE=publisher
      - RUST_LOG=info
    volumes:
      - did_share:/shared
    networks:
      dht_net:
        ipv4_address: 172.20.0.11
    depends_on:
      - seed

  peer2:
    build: .
    container_name: dht_peer_2
    environment:
      - NODE_PORT=5680
      - BOOTSTRAP_ADDR=172.20.0.10:5678
      - ROLE=retriever
      - RUST_LOG=info
    volumes:
      - did_share:/shared
    networks:
      dht_net:
        ipv4_address: 172.20.0.12
    depends_on:
      - seed

  peer3:
    build: .
    container_name: dht_peer_3
    environment:
      - NODE_PORT=5681
      - BOOTSTRAP_ADDR=172.20.0.10:5678
      - ROLE=publisher
      - RUST_LOG=info
    networks:
      dht_net:
        ipv4_address: 172.20.0.13
    depends_on:
      - seed

# In memory (tmpfs): emptied once no container uses it, so a retriever never
# reads the DID of an earlier run.
volumes:
  did_share:
    driver_opts:
      type: tmpfs
      device: tmpfs

networks:
  dht_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24