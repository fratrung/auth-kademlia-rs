[package]
name = "auth-kademlia-rs"
version = "0.1.0"
edition = "2021"

[lib]
# cdylib  → Python extension (.so / .pyd) built by maturin
# rlib    → Rust library used by `cargo test` and examples
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "dht_node"
path = "scripts/dht_node.rs"

[[bin]]
name = "resilience_victim"
path = "scripts/resilience_victim.rs"

[[bin]]
name = "resilience_attacker"
path = "scripts/resilience_attacker.rs"

[[bin]]
name = "testbed_node"
path = "testbed/node.rs"
required-features = ["testbed"]

[[bin]]
name = "testbed_attacker"
path = "testbed/attacker.rs"
required-features = ["testbed"]

[features]
default = []
# Build the Python extension module:
#   maturin develop --features python
#   maturin build   --features python
python = ["dep:pyo3", "pyo3/extension-module", "dep:pyo3-async-runtimes"]
# Docker testbed binaries (testbed/): the node and the attacker. Off by default.
testbed = ["dep:libc", "counters"]
# Count the datagrams and bytes a node sends, its resends and its STORE checks
# (src/counters.rs). Off by default.
counters = []

[dependencies]
# Async runtime
tokio          = { version = "1", features = ["full"] }
futures        = "0.3"
async-trait    = "0.1"
uuid               = { version = "1", features = ["v4"] }

# Serialization
serde          = { version = "1", features = ["derive"] }
serde_json     = "1"
bincode        = "1"

# Cryptography / encoding
sha2               = "0.10"
base64             = "0.22"
hex                = "0.4"
rand               = "0.8"

# Post-quantum, from AWS-LC (ADR 0003): ML-DSA-65 for records, ephemeral
# ML-KEM-768 in the key manager
aws-lc-rs          = { version = "1.19", default-features = false, features = ["aws-lc-sys", "alloc"] }
# Ed25519
ed25519-dalek      = { version = "2", features = ["rand_core"] }
# RSA
rsa                = { version = "0.9", features = ["sha2"] }

# Data structures
indexmap       = "2"
dashmap        = "6"
moka           = { version = "0.12", features = ["sync"] }

# Error handling
thiserror      = "1"

# Logging
log            = "0.4"
env_logger     = "0.11"

# Python binding (optional — only compiled with --features python)
# Use maturin for building the extension: `maturin build --features python`
pyo3                = { version = "0.21", optional = true, features = ["extension-module"] }
pyo3-async-runtimes = { version = "0.21", features = ["tokio-runtime"], optional = true }
primitive-types = "0.12"
# Raw packet socket of the testbed attacker (feature "testbed" only)
libc = { version = "0.2", optional = true }
 


[dev-dependencies]
tokio              = { version = "1", features = ["full", "test-util"] }
futures            = "0.3"
env_logger         = "0.11"

[[test]]
name = "scenario_replication"
path = "tests/scenarios/replication.rs"

[[test]]
name = "scenario_cache"
path = "tests/scenarios/cache.rs"

[[test]]
name = "scenario_churn"
path = "tests/scenarios/churn.rs"

[[test]]
name = "scenario_worker_pool"
path = "tests/scenarios/worker_pool.rs"

[[test]]
name = "scenario_crypto"
path = "tests/scenarios/crypto.rs"
