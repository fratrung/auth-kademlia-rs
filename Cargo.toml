[package]
name = "auth-kademlia-rs"
version = "0.1.0"
edition = "2021"

[lib]
# cdylib  → Python extension (.so / .pyd) built by maturin
# rlib    → Rust library used by `cargo test` and examples
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "dht_node"
path = "scripts/dht_node.rs"

[[bin]]
name = "resilience_victim"
path = "scripts/resilience_victim.rs"

[[bin]]
name = "resilience_attacker"
path = "scripts/resilience_attacker.rs"

[features]
default = []
# Build the Python extension module:
#   maturin develop --features python
#   maturin build   --features python
python = ["dep:pyo3", "pyo3/extension-module", "dep:pyo3-async-runtimes"]

[dependencies]
# Async runtime
tokio          = { version = "1", features = ["full"] }
futures        = "0.3"
async-trait    = "0.1"
uuid               = { version = "1", features = ["v4"] }

# Serialization
serde          = { version = "1", features = ["derive"] }
serde_json     = "1"
bincode        = "1"

# Cryptography / encoding
sha1               = "0.10"
sha2               = "0.10"
base64             = "0.22"
hex                = "0.4"
rand               = "0.8"

# Post-quantum (Dilithium and Kyber)
pqcrypto-dilithium = "0.5"
pqcrypto-kyber     = "0.8"
pqcrypto-traits    = "0.3"
# Ed25519
ed25519-dalek      = { version = "2", features = ["rand_core"] }
# RSA
rsa                = { version = "0.9", features = ["sha2"] }

# Data structures
indexmap       = "2"
dashmap        = "6"
moka           = { version = "0.12", features = ["sync"] }

# Error handling
thiserror      = "1"

# Logging
log            = "0.4"
env_logger     = "0.11"

# Python binding (optional — only compiled with --features python)
# Use maturin for building the extension: `maturin build --features python`
pyo3                = { version = "0.21", optional = true, features = ["extension-module"] }
pyo3-async-runtimes = { version = "0.21", features = ["tokio-runtime"], optional = true }
primitive-types = "0.12"
 


[dev-dependencies]
tokio              = { version = "1", features = ["full", "test-util"] }
futures            = "0.3"
env_logger         = "0.11"
pqcrypto-dilithium = "0.5"
pqcrypto-traits    = "0.3"

[[test]]
name = "scenario_replication"
path = "tests/scenarios/replication.rs"

[[test]]
name = "scenario_cache"
path = "tests/scenarios/cache.rs"

[[test]]
name = "scenario_churn"
path = "tests/scenarios/churn.rs"

[[test]]
name = "scenario_worker_pool"
path = "tests/scenarios/worker_pool.rs"

[[test]]
name = "scenario_crypto"
path = "tests/scenarios/crypto.rs"
